name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - { os: windows-2022, compiler: msvc, build_type: Debug }
          - { os: windows-2022, compiler: msvc, build_type: Release }
    steps:
      - uses: actions/checkout@v5

      - name: Outils (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc-14"   >> "$GITHUB_ENV"
            echo "CXX=g++-14"  >> "$GITHUB_ENV"
          else
            echo "CC=clang-18"   >> "$GITHUB_ENV"
            echo "CXX=clang++-18" >> "$GITHUB_ENV"
          fi

      - name: Environnement MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configuration
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DDECAYSOLVER_WARNINGS_AS_ERRORS=ON

      - name: Compilation
        run: cmake --build build --parallel

      - name: Tests
        run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Outils
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: Vérification du formatage
        run: |
          find include src apps tests \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror
